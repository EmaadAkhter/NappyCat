# Windows cannot be cross-compiled from a Mac, so CI builds it.
#
# Runs on pushes that touch app code, and publishes NappyCat-windows.zip to an
# orphan `builds` branch — retrievable over plain git+SSH, so no API token is
# ever needed on the laptop side.
name: desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'desktop/**'
      - '**.md'

# The default GITHUB_TOKEN is read-only; pushing the builds branch needs this.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=TIDAL_ENV=prod
      - name: Package
        shell: pwsh
        run: |
          # Console-flash-free launcher for the desktop-pinned widget mode.
          @'
          Set fso = CreateObject("Scripting.FileSystemObject")
          Set sh = CreateObject("WScript.Shell")
          sh.CurrentDirectory = fso.GetParentFolderName(WScript.ScriptFullName)
          sh.Run """NappyCat.exe"" --widget", 1, False
          '@ | Set-Content "build/windows/x64/runner/Release/NappyCat Widget.vbs"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath NappyCat-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NappyCat-windows
          path: NappyCat-windows.zip
      # The runner IS a Windows box — boot the app on it and photograph the
      # screen. Proves the exe actually launches, renders, and survives
      # Firebase init on real Windows, not just that it compiled.
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/windows/x64/runner/Release -Filter *.exe | Select-Object -First 1
          Start-Process $exe.FullName
          Start-Sleep 30
          $p = Get-Process ($exe.BaseName) -ErrorAction SilentlyContinue
          if ($p) { "ALIVE title='$($p.MainWindowTitle)'" | Out-File smoke.txt }
          else { "DEAD after 30s" | Out-File smoke.txt }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke.png")
          Get-Content smoke.txt
          Stop-Process -Name ($exe.BaseName) -Force -ErrorAction SilentlyContinue
          # Round two: the desktop-pinned widget mode.
          Start-Sleep 2
          Start-Process $exe.FullName -ArgumentList "--widget"
          Start-Sleep 25
          # The widget pins UNDER windows; clear the desk so the camera sees it.
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep 3
          $bmp2 = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g2 = [System.Drawing.Graphics]::FromImage($bmp2)
          $g2.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp2.Save("smoke-widget.png")
          Stop-Process -Name ($exe.BaseName) -Force -ErrorAction SilentlyContinue
      # ---- Windows 11 Widgets Board package ----
      # Widget providers must have package identity, so this wraps the same
      # Release build + a COM provider exe into a self-signed MSIX. Marked
      # continue-on-error so a packaging failure never blocks the plain zip.
      # VS msbuild, not `dotnet publish`: the Windows App SDK's PRI-generation
      # task only ships with Visual Studio, and the dotnet CLI can't load it.
      - name: Build widget provider
        continue-on-error: true
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          & $msbuild windows/widget_provider/NappyCatWidgetProvider.csproj /restore /t:Publish `
            /p:Configuration=Release /p:Platform=x64 /p:PublishDir="$PWD\provider_out\" /v:m
          if ($LASTEXITCODE -ne 0) { throw "msbuild publish failed" }
          if (-not (Test-Path provider_out/NappyCatWidgetProvider.exe)) { throw "provider exe missing" }
      - name: Package + sign MSIX
        continue-on-error: true
        shell: pwsh
        run: |
          $layout = "msix_layout"
          New-Item -ItemType Directory "$layout/app","$layout/provider","$layout/Assets","$layout/Public" -Force | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* "$layout/app/"
          Copy-Item -Recurse provider_out/* "$layout/provider/"
          Copy-Item assets/icon/app_icon.png "$layout/Assets/icon.png"
          Copy-Item assets/cats/tabby_asleep.png "$layout/Assets/screenshot.png"
          (Get-Content windows/msix/AppxManifest.xml) -replace '__VERSION__', "1.1.$env:GITHUB_RUN_NUMBER.0" | Set-Content "$layout/AppxManifest.xml"
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx pack /d $layout /p NappyCat.msix /nv
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=NappyCat" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
          Export-Certificate -Cert $cert -FilePath NappyCat.cer | Out-Null
          $pw = ConvertTo-SecureString "nappycat" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath cert.pfx -Password $pw | Out-Null
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool sign /fd SHA256 /f cert.pfx /p nappycat NappyCat.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
      - name: Install MSIX on runner (verify)
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Certificate -FilePath NappyCat.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          if (-not (Get-AppxPackage -Name "Microsoft.WindowsAppRuntime.1.6*")) {
            Invoke-WebRequest "https://aka.ms/windowsappsdk/1.6/latest/windowsappruntimeinstall-x64.exe" -OutFile runtime.exe
            Start-Process .\runtime.exe -ArgumentList "--quiet" -Wait
          }
          Add-AppxPackage NappyCat.msix
          Get-AppxPackage -Name "NappyCat.Desktop" | Format-List Name, Version, PackageFamilyName, InstallLocation
          # Provider self-test: prints the Adaptive Card JSON it would serve.
          & provider_out\NappyCatWidgetProvider.exe --selftest
      - name: Publish zip to builds branch
        shell: bash
        run: |
          mkdir /tmp/out && cp NappyCat-windows.zip smoke.png smoke.txt /tmp/out/
          cp smoke-widget.png /tmp/out/ 2>/dev/null || true
          cp windows/msix/install.ps1 windows/msix/setup.ps1 windows/msix/setup.cmd windows/msix/uninstall.ps1 /tmp/out/
          cp desktop/macos/NappyCat.dmg /tmp/out/
          cp NappyCat.msix NappyCat.cer /tmp/out/ 2>/dev/null || echo "msix not built this run"
          cd /tmp/out
          git init -b builds
          git config user.name ci
          git config user.email ci@nappycat
          git add NappyCat-windows.zip smoke.png smoke.txt
          git add smoke-widget.png 2>/dev/null || true
          git add install.ps1 setup.ps1 setup.cmd uninstall.ps1 NappyCat.dmg
          git add NappyCat.msix NappyCat.cer 2>/dev/null || true
          git commit -m "windows build $GITHUB_SHA"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
