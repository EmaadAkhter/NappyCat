name: tidal
description: "A slow, disappearing messenger for two people. The cat carries the letters."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  flutter:
    sdk: flutter
  home_widget: ^0.9.3
  path_provider: ^2.1.6
  workmanager: 0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0

# The tomato-hood cat. `dart run flutter_launcher_icons` regenerates every
# platform's icon set from the one source image.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/cats/

  fonts:
    - family: Nunito
      fonts:
        # Variable font: one file covers ExtraLight..Black. Flutter drives the
        # weight axis from FontWeight, so no per-weight files are needed.
        - asset: assets/fonts/Nunito-Variable.ttf
