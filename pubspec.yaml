name: tidal
description: "A slow, disappearing messenger for two people. The cat carries the letters."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  flutter:
    sdk: flutter
  home_widget: ^0.9.3
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/cats/

  fonts:
    - family: Nunito
      fonts:
        # Variable font: one file covers ExtraLight..Black. Flutter drives the
        # weight axis from FontWeight, so no per-weight files are needed.
        - asset: assets/fonts/Nunito-Variable.ttf
